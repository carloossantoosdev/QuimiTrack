services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quimitrack
      POSTGRES_PASSWORD: quimitrack
      POSTGRES_DB: quimitrack
    ports:
      - "5432:5432"
    volumes:
      - quimitrack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quimitrack -d quimitrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://quimitrack:quimitrack@postgres:5432/quimitrack
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  quimitrack-postgres:
