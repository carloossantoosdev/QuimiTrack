name: ci

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quimitrack
          POSTGRES_PASSWORD: quimitrack
          POSTGRES_DB: quimitrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quimitrack -d quimitrack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://quimitrack:quimitrack@localhost:5432/quimitrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
